name: Release

# Orchestrates every release. release-please (one grouped release PR) cuts a
# draft per released package on merge:
#
#   vX.Y.Z         unified installer, the "latest" release  → release-unified.yml
#   daemon/vX.Y.Z  standalone daemon archives               → release-daemon.yml
#   gui/vX.Y.Z     desktop bundles stamped with gui version → release-gui.yml
#   cli/vX.Y.Z     standalone CLI archives                  → release-cli.yml
#
# The component pipelines are chained from this run rather than triggered by
# their tags: release-please may create tags with GITHUB_TOKEN, which never
# triggers another workflow. A failing component pipeline does not hold back
# the unified release, and vice versa. See docs/release-pipeline.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to repair (e.g. v0.6.0, daemon/v0.11.0, gui/v0.11.0, cli/v0.11.0)'
        required: true
      channels_only:
        description: 'Repair mutable GHCR aliases for an already published unified release'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build the release for this tag version from the selected branch; upload, push and publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Opt-in to Node.js 24 for all JavaScript actions (Node 20 deprecated Sep 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Merged release-please commits contain `chore(main): release` (the grouped
# release PR title is pinned in release-please-config.json). Keep those and
# manual repairs serialized because they mutate shared drafts, GHCR aliases,
# and the Homebrew tap. Ordinary pushes use a separate coalescing group, so they
# cannot evict or delay a pending release.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         contains(github.event.head_commit.message, 'chore(main): release '))
        && 'heimdallm-release-pipeline'
        || 'heimdallm-release-please' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(main): release ') }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      daemon_release_created: ${{ steps.release.outputs['daemon--release_created'] }}
      daemon_tag_name: ${{ steps.release.outputs['daemon--tag_name'] }}
      gui_release_created: ${{ steps.release.outputs['flutter_app--release_created'] }}
      gui_tag_name: ${{ steps.release.outputs['flutter_app--tag_name'] }}
      cli_release_created: ${{ steps.release.outputs['cli--release_created'] }}
      cli_tag_name: ${{ steps.release.outputs['cli--tag_name'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # Prefer a PAT (RELEASE_PLEASE_TOKEN) so the release PR's commits are
          # attributed to a user and DO trigger the Tests / Docker workflows.
          # PRs created with the default GITHUB_TOKEN never trigger further
          # workflows, which left the release PR with no checks (UNSTABLE) and
          # unmergeable. Falls back to GITHUB_TOKEN when the secret is absent
          # (release PR is still created, but its checks must be run manually
          # via the workflow_dispatch added to tests.yml / docker-publish.yml).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Decide which release pipelines this run drives, and validate every tag
  # before any job uses it.
  plan:
    name: Plan release pipelines
    needs: release-please
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.release-please.result == 'success' &&
        needs.release-please.outputs.releases_created == 'true'))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      unified_tag: ${{ steps.plan.outputs.unified_tag }}
      daemon_tag: ${{ steps.plan.outputs.daemon_tag }}
      gui_tag: ${{ steps.plan.outputs.gui_tag }}
      cli_tag: ${{ steps.plan.outputs.cli_tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/release
          persist-credentials: false

      - name: Resolve tags
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CHANNELS_ONLY: ${{ inputs.channels_only }}
          DRY_RUN: ${{ inputs.dry_run }}
          UNIFIED_CREATED: ${{ needs.release-please.outputs.release_created }}
          UNIFIED_TAG: ${{ needs.release-please.outputs.tag_name }}
          DAEMON_CREATED: ${{ needs.release-please.outputs.daemon_release_created }}
          DAEMON_TAG: ${{ needs.release-please.outputs.daemon_tag_name }}
          GUI_CREATED: ${{ needs.release-please.outputs.gui_release_created }}
          GUI_TAG: ${{ needs.release-please.outputs.gui_tag_name }}
          CLI_CREATED: ${{ needs.release-please.outputs.cli_release_created }}
          CLI_TAG: ${{ needs.release-please.outputs.cli_tag_name }}
        run: |
          set -euo pipefail
          declare -A TAGS=([unified]='' [daemon]='' [gui]='' [cli]='')

          if [ "$EVENT_NAME" = push ]; then
            REF="$GITHUB_SHA"
            [ "$UNIFIED_CREATED" = true ] && TAGS[unified]=$UNIFIED_TAG
            [ "$DAEMON_CREATED" = true ] && TAGS[daemon]=$DAEMON_TAG
            [ "$GUI_CREATED" = true ] && TAGS[gui]=$GUI_TAG
            [ "$CLI_CREATED" = true ] && TAGS[cli]=$CLI_TAG
          else
            read -r KIND _ <<< "$(scripts/release/parse-tag.sh "$INPUT_TAG")"
            if [ "$CHANNELS_ONLY" = true ] && [ "$KIND" != unified ]; then
              echo "::error::channels_only only applies to unified vX.Y.Z releases"
              exit 1
            fi
            if [ "$CHANNELS_ONLY" = true ] && [ "$DRY_RUN" = true ]; then
              echo "::error::channels_only and dry_run are mutually exclusive"
              exit 1
            fi
            TAGS[$KIND]=$INPUT_TAG
            # A dry run builds the selected branch; a repair rebuilds the tag.
            if [ "$DRY_RUN" = true ]; then REF="$GITHUB_SHA"; else REF="$INPUT_TAG"; fi
          fi

          BUILD=false
          for KIND in unified daemon gui cli; do
            TAG=${TAGS[$KIND]}
            if [ -n "$TAG" ]; then
              read -r TAG_KIND _ <<< "$(scripts/release/parse-tag.sh "$TAG")"
              test "$TAG_KIND" = "$KIND" || {
                echo "::error::release-please reported $TAG for the $KIND package"
                exit 1
              }
              BUILD=true
            fi
            echo "${KIND}_tag=$TAG" >> "$GITHUB_OUTPUT"
          done
          [ "$CHANNELS_ONLY" = true ] && BUILD=false
          {
            echo "ref=$REF"
            echo "build=$BUILD"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "| Pipeline | Tag |"
            echo "|----------|-----|"
            for KIND in unified daemon gui cli; do
              echo "| $KIND | \`${TAGS[$KIND]:-—}\` |"
            done
            echo ""
            echo "Source: \`$REF\` · channels only: ${CHANNELS_ONLY:-false} · dry run: ${DRY_RUN:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Test gate — every build pipeline depends on this
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: Tests
    needs: plan
    if: always() && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: |
            daemon/go.sum
            cli/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libnotify-dev \
            libsecret-1-dev

      - name: Flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Daemon tests
        id: daemon-tests
        working-directory: daemon
        run: go test ./... -timeout 60s

      - name: Daemon vet
        id: daemon-vet
        working-directory: daemon
        run: go vet ./...

      - name: CLI tests
        id: cli-tests
        working-directory: cli
        run: go test ./... -timeout 60s

      - name: CLI vet
        id: cli-vet
        working-directory: cli
        run: go vet ./...

      - name: Flutter analyze
        id: flutter-analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Flutter tests
        id: flutter-tests
        working-directory: flutter_app
        run: flutter test

      - name: Summary
        if: always()
        run: |
          {
            echo "## Test Results"
            echo ""
            echo "| Suite | Status |"
            echo "|-------|--------|"
            echo "| Daemon (go test) | ${{ steps.daemon-tests.outcome || '—' }} |"
            echo "| Daemon (go vet)  | ${{ steps.daemon-vet.outcome || '—' }} |"
            echo "| CLI (go test)    | ${{ steps.cli-tests.outcome || '—' }} |"
            echo "| CLI (go vet)     | ${{ steps.cli-vet.outcome || '—' }} |"
            echo "| Flutter analyze  | ${{ steps.flutter-analyze.outcome || '—' }} |"
            echo "| Flutter test     | ${{ steps.flutter-tests.outcome || '—' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # Release pipelines — independent of each other
  # ═══════════════════════════════════════════════════════════════════════════
  unified:
    name: Unified vX.Y.Z
    needs: [plan, tests]
    if: >-
      always() && needs.plan.outputs.unified_tag != '' &&
      (needs.tests.result == 'success' || inputs.channels_only)
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/release-unified.yml
    with:
      tag: ${{ needs.plan.outputs.unified_tag }}
      ref: ${{ needs.plan.outputs.ref }}
      channels_only: ${{ inputs.channels_only == true }}
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  daemon:
    name: Component daemon/vX.Y.Z
    needs: [plan, tests]
    if: always() && needs.plan.outputs.daemon_tag != '' && needs.tests.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-daemon.yml
    with:
      tag: ${{ needs.plan.outputs.daemon_tag }}
      ref: ${{ needs.plan.outputs.ref }}
      dry_run: ${{ inputs.dry_run == true }}

  gui:
    name: Component gui/vX.Y.Z
    needs: [plan, tests]
    if: always() && needs.plan.outputs.gui_tag != '' && needs.tests.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-gui.yml
    with:
      tag: ${{ needs.plan.outputs.gui_tag }}
      ref: ${{ needs.plan.outputs.ref }}
      dry_run: ${{ inputs.dry_run == true }}

  cli:
    name: Component cli/vX.Y.Z
    needs: [plan, tests]
    if: always() && needs.plan.outputs.cli_tag != '' && needs.tests.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: ${{ needs.plan.outputs.cli_tag }}
      ref: ${{ needs.plan.outputs.ref }}
      dry_run: ${{ inputs.dry_run == true }}
