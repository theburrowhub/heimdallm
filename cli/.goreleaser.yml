version: 2

project_name: heimdallm-cli

builds:
  - main: ./cmd/heimdallm-cli
    binary: heimdallm-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "cli-checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: theburrowhub
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    # Generate the formula in dist, but publish it only after the GitHub draft
    # is atomically promoted by the final release job.
    skip_upload: true
    homepage: https://github.com/theburrowhub/heimdallm
    description: "CLI client for Heimdallm — monitor PRs, issues, and activity from the terminal"
    license: MIT
    install: |
      bin.install "heimdallm-cli"
    test: |
      system "#{bin}/heimdallm-cli", "--help"

release:
  github:
    owner: theburrowhub
    name: heimdallm
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: false
  mode: keep-existing
  extra_files: []
