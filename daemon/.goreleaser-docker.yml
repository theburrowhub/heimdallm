version: 2

project_name: heimdallm

builds:
  - id: daemon
    main: ./cmd/heimdallm
    binary: heimdalld
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}}

# ── Docker image — pushed to GHCR ────────────────────────────────────────────
# Used by: goreleaser-daemon job (release.yml)
dockers:
  - ids:
      - daemon
    image_templates:
      # Publish only immutable references in the build job. Major, minor, and
      # latest are promoted by the release finalizer after every asset passes.
      - "ghcr.io/theburrowhub/heimdallm:{{ .Version }}"
      - "ghcr.io/theburrowhub/heimdallm:{{ .ShortCommit }}"
    dockerfile: ../docker/Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--cache-from=type=gha"
      - "--cache-to=type=gha,mode=max"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/theburrowhub/heimdallm"

changelog:
  disable: true

release:
  # This config only publishes OCI images. It must never create, mutate, or
  # prematurely publish the GitHub release used by desktop/package artifacts.
  disable: true
