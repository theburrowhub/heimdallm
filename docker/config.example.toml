# Heimdallm configuration
# This file is optional — all values can be set via environment variables.
# Environment variables take precedence over values in this file.

[server]
port = 7842
bind_addr = "0.0.0.0"

[github]
poll_interval = "5m"
repositories = ["org/repo1", "org/repo2"]

# Topic-based auto-discovery (optional).
# When discovery_topic is set, any repo inside discovery_orgs that carries the
# topic is automatically monitored alongside the static list above. The merged
# list is refreshed every discovery_interval. See:
# https://docs.github.com/repositories/classifying-your-repository-with-topics
# discovery_topic    = "heimdallm-review"
# discovery_orgs     = ["your-org", "your-other-org"]   # required when discovery_topic is set
# discovery_interval = "15m"                             # any Go duration; defaults to 15m

# Base directories for auto-resolving local_dir per repo (list).
# Each {base}/{repo-name} is checked in order. Supports multiple workspace groups.
# local_dir_base = ["/repos/ai-platform-workspace/workspace", "/repos"]

[ai]
# Available: claude, gemini, codex, opencode
primary = "claude"
# fallback = "gemini"
review_mode = "single"   # "single" or "multi"
# execution_timeout = "30m"   # default: 20m; exceptional override for unusually long runs
# clone_dir = "/repos/worktrees"

# When true, a review that finds ANY issue at or above never_approve_min_severity
# requests changes instead of approving (high-severity reviews already request
# changes regardless of this setting; a clean review still approves).
# Overridable per org ([ai.orgs.*]) and per repo ([ai.repos.*]). Default: false.
# never_approve_with_issues = false

# Minimum finding severity that triggers the never_approve_with_issues
# request-changes gate: "low", "medium" or "high". Unset/empty = "medium", so
# reviews whose findings are all low-severity nits still approve. Set "low" to
# request changes on any finding at all. Overridable per org and per repo.
# never_approve_min_severity = "medium"

# Per-CLI settings (optional)
# [ai.agents.claude]
# model = "claude-sonnet-4-20250514"
# max_turns = 0
# effort = "high"
# permission_mode = "auto"
# bare = true                    # WARNING: bare mode disables OAuth authentication.
#                                # Use only with ANTHROPIC_API_KEY, not CLAUDE_CODE_OAUTH_TOKEN.
# dangerously_skip_perms = true
# no_session_persistence = true

# [ai.agents.gemini]
# model = "gemini-2.5-pro"

# [ai.agents.codex]
# model = "codex-mini"
# approval_mode = "never"

# [ai.agents.opencode]
# model = "anthropic/claude-sonnet-4"

# Per-org overrides (optional)
# Applied to all repos in the org unless overridden per-repo.
# Omit fields to inherit.
# [ai.orgs."freepik-company"]
# primary = "gemini"
# fallback = "claude"
# review_mode = "multi"
# prompt = "org-pr-review-profile"
# clone_dir = "/repos/freepik-worktrees"
# never_approve_with_issues = true

# [ai.orgs."theburrowhub"]
# primary = "codex"

# Per-repo AI overrides (optional)
# [ai.repos."org/repo1"]
# primary = "codex"
# review_mode = "multi"
# local_dir = "/repos/repo1"    # mount from host via docker-compose volumes
# prompt          = "pr-review-agent-id"    # Agent profile for PR reviews
# never_approve_min_severity = "medium"

# ── Merge tracking ────────────────────────────────────────────────────────────
# Watches the PRs you authored or are assigned to and reports exactly what is
# blocking each merge. Every automation is off by default; omitting this whole
# section is a full no-op. See §13 of docs/configuration-guide.md.
#
# [merge_tracking]
# enabled           = true    # report only — no writes to any repository
# include_assigned  = true
#
# Automations, each independent. resolve_conflicts FORCE-PUSHES to your branch.
# enable_auto_merge = false
# update_branch     = false
# resolve_conflicts = false
# merge             = false
# merge_method      = "squash"
#
# [merge_tracking.repos."org/repo1"]
# merge            = true
# require_approval = true

[retention]
max_days = 90
