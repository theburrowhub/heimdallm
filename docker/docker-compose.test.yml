# Override for isolated local testing.
#
# Do not invoke this file directly. docker/scripts/test-local.sh and
# docker/scripts/test-web.sh generate a unique Compose project and required
# container names for every run.
services:
  heimdallm:
    container_name: "${HEIMDALLM_TEST_DAEMON_CONTAINER_NAME:?use an isolated Docker test runner}"
    restart: "no"
    environment:
      - HEIMDALLM_POLL_INTERVAL=${HEIMDALLM_POLL_INTERVAL:-1m}
    volumes:
      - heimdallm-test-data:/data
      - heimdallm-test-config:/config
      # Gemini OAuth tokens from host (read-only; refresh is ephemeral;
      # uncomment for Level 3 E2E test):
      # - ~/.gemini:/home/heimdallm/.gemini:ro

  web:
    container_name: "${HEIMDALLM_TEST_WEB_CONTAINER_NAME:?use an isolated Docker test runner}"
    restart: "no"
    # Set HEIMDALLM_API_TOKEN to empty (the entrypoint's `[ -n "$VAR" ]`
    # check treats empty and unset the same, falling through to the file
    # at /data/api_token). This overrides whatever stale value the
    # operator might have in docker/.env from a prior run, so the web
    # container always uses the token the test-mode daemon just wrote
    # into the shared volume.
    environment:
      - HEIMDALLM_API_TOKEN=
    volumes:
      # Mount the same test-data volume the daemon uses, so /data/api_token
      # is the one this daemon generated — not the main heimdallm-data
      # volume which belongs to a different (possibly non-existent) daemon.
      - heimdallm-test-data:/data:ro

volumes:
  heimdallm-test-data:
    driver: local
  heimdallm-test-config:
    driver: local
