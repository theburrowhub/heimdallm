name: heimdallm
description: GitHub PR Auto-Review Desktop App
version: 0.8.11 # x-release-please-version

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.2
  flutter_riverpod: ^3.0.0
  http: ^1.2.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  go_router: ^17.0.0
  shared_preferences: ^2.2.0
  json_annotation: ^4.8.0
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.0
  # package:web gives us typed bindings to Notification / window for the
  # web build's platform_services_web.dart. Already pulled in transitively
  # by flutter; declare it explicitly so the analyzer is happy.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon.png"
  macos:
    generate: true
    image_path: "assets/icon.png"
  linux:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/tray_icon.png
    - assets/tray_icon@2x.png
